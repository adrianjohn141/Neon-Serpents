name: neon-serpents

services:
  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8193:80"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: ops/web.Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SERVER_TRAINING_API: /server-api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    image: neon-serpents-server:local
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["python", "-m", "uvicorn", "server.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    restart: unless-stopped
    environment: &server-environment
      DATABASE_URL: postgresql+psycopg://neon:${POSTGRES_PASSWORD}@postgres:5432/neon_serpents
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: neon-serpents
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SERVER_PUBLIC_ORIGIN: http://localhost:8193
      ADMIN_PASSWORD_HASH_B64: ${ADMIN_PASSWORD_HASH_B64}
      SESSION_SECRET: ${SESSION_SECRET}
      MANIFEST_SIGNING_SEED: ${MANIFEST_SIGNING_SEED}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_MANUAL_PROMOTION: ${ALLOW_MANUAL_PROMOTION:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  trainer:
    image: neon-serpents-server:local
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["python", "-m", "server.trainer.worker_entry"]
    restart: unless-stopped
    environment:
      <<: *server-environment
      ACTOR_COMMAND: node /app/dist-server/server/actor-coordinator.js
      TRAINER_GRPC_BIND: 0.0.0.0:50051
    volumes:
      - trainer-cache:/var/lib/neon-serpents/cache
    depends_on:
      api:
        condition: service_healthy

  actors:
    build:
      context: .
      dockerfile: ops/actors.Dockerfile
    command: ["node", "dist-server/server/actor-coordinator.js"]
    restart: unless-stopped
    environment:
      LEARNER_GRPC_TARGET: trainer:50051
      ACTOR_COUNT: ${ACTOR_COUNT:-12}
    depends_on:
      - trainer

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: neon_serpents
      POSTGRES_USER: neon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neon -d neon_serpents"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "/init/minio-init.sh"]
    volumes:
      - ./ops/minio-init.sh:/init/minio-init.sh:ro
    depends_on:
      minio:
        condition: service_started

  backup:
    build:
      context: .
      dockerfile: ops/backup.Dockerfile
    profiles: ["backup"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      RESTIC_REPOSITORY: /repository
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
    entrypoint: ["/bin/sh", "/backup/backup.sh"]
    volumes:
      - ./ops/backup.sh:/backup/backup.sh:ro
      - backup-staging:/staging
      - ${LOCAL_BACKUP_PATH:-./artifacts/backups}:/repository
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  minio-data:
  trainer-cache:
  caddy-data:
  backup-staging:
